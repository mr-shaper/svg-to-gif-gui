<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Animation to GIF Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>
                <svg height="24" viewBox="0 0 16 16" version="1.1" width="24" aria-hidden="true" fill="white">
                    <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.46-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
                </svg>
                <span id="appTitle">SVG to GIF Converter</span>
            </h1>
            <div class="language-selector">
                <select id="languageSelect" class="language-select">
                    <option value="zh-CN">中文</option>
                    <option value="en-US">English</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <label id="labelSvgFile">SVG 文件</label>
                <div class="file-select">
                    <input type="text" id="inputPath" placeholder="请选择 .svg 文件" readonly>
                    <button class="btn" id="btnSelect">选择文件</button>
                </div>
            </div>

            <div class="form-group" id="sizePresetGroup" style="display: none;">
                <label id="labelSizePreset">
                    尺寸预设
                    <span class="hint-text" id="originalSizeHint"></span>
                </label>
                <select id="sizePreset" class="size-preset-select">
                    <option value="custom">自定义尺寸</option>
                </select>
            </div>

            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label id="labelWidth">宽度 (px)</label>
                        <input type="number" id="width" value="600">
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label id="labelHeight">高度 (px)</label>
                        <input type="number" id="height" value="640">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label id="labelFrameRate">帧率 (FPS)</label>
                        <input type="number" id="fps" value="20" min="10" max="60">
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label id="labelDuration">
                            时长 (秒)
                            <span id="durationHint" class="hint-text"></span>
                        </label>
                        <div style="display: flex; gap: 8px;">
                            <input type="number" id="duration" value="30" style="flex: 1;">
                            <button class="btn-secondary" id="btnDetect" title="自动检测动画时长">🔍 <span id="btnDetectText">自动检测</span></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label id="labelGifQuality">GIF 质量 (1-20)</label>
                        <input type="range" id="quality" min="1" max="20" value="10" style="width: 100%;">
                        <div class="quality-hint">
                            <span id="qualityHigh">高质量</span>
                            <span id="qualityValue">10</span>
                            <span id="qualitySmall">小文件</span>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label id="labelFileSizeLimit">
                            文件大小限制 (MB)
                            <span class="hint-text" id="autoCompressHint">超过将自动压缩</span>
                        </label>
                        <input type="number" id="maxSize" value="10" min="1" max="100" step="1">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label id="labelOutputFile">输出文件</label>
                <div class="file-select">
                    <input type="text" id="outputPath" placeholder="选择保存路径 (可选)" readonly>
                    <button class="btn" id="btnSavePath">选择路径</button>
                </div>
            </div>

            <button class="btn-primary" id="btnStart">开始转换</button>
        </div>

        <div id="status-area">
            <div class="status-text" id="statusText">准备就绪</div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="result-area" id="resultArea">
                <div class="result-msg" id="resultMsg">转换成功!</div>
                <div class="size-info" id="sizeInfo"></div>
                <button class="btn" id="btnOpenFolder">打开文件夹</button>
            </div>
        </div>

        <footer>
            <span id="footerRunningOn">Running on</span> <span id="platform"></span>
        </footer>
    </div>
    <script src="i18n-renderer.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
